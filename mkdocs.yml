site_name: ShivaOps AI | Projects & Portfolio
site_description: Hands-on projects in Oracle development, DevOps, AI-assisted applications and automation
site_author: ShivaOps AI
site_url: https://shivaops.github.io/
repo_url: https://github.com/shivaops/shivaops.github.io
repo_name: ShivaOps GitHub

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.tabs
    - navigation.top

plugins: []

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences

extra_css:
  - assets/custom.css

nav:
  - Home: index.md
  - About Me: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shivaops
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@ShivaOps-AI
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/shivaops/
